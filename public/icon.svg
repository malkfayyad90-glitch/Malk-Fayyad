<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Inner Ornamental Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />
  
  <!-- Syrian Shawarma Spit Flame Icon -->
  <path d="M256 120 C240 160 210 180 210 220 C210 250 230 270 256 270 C282 270 302 250 302 220 C302 180 272 160 256 120 Z" fill="url(#goldGrad)" />
  
  <!-- Damascus Letter "د" in Arabic calligraphy style -->
  <text x="256" y="380" font-family="'Cairo', sans-serif, Arial" font-size="160" font-weight="900" text-anchor="middle" fill="#ffffff">د</text>
  
  <!-- Text Kicker -->
  <text x="256" y="440" font-family="'Cairo', sans-serif, Arial" font-size="28" font-weight="700" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="2">الدمشقي كفر الزيات</text>
</svg>
